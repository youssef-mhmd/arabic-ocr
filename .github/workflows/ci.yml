name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # Qt needs a few system libraries on Linux (the tests use its "offscreen" mode).
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      # Installs runtime + GUI + dev + data deps (no torch), exactly as pinned in uv.lock.
      - run: uv sync --locked --extra gui
      # Two fonts for the renderer tests (fonts are never committed to git).
      - run: uv run python -m training.download_fonts --only notonaskharabic,vazirmatn
      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          uv run pytest -v 2>&1 | tee pytest.log
      # Failures are attached as an annotation, readable without signing in.
      - name: Show the end of the test log on failure
        if: failure()
        shell: bash
        run: |
          echo "::error title=pytest log (end)::$(tail -n 70 pytest.log 2>/dev/null | awk '{gsub(/%/,"%25"); gsub(/\r/,""); printf "%s%%0A", $0}')"
      - run: uv run arabic-ocr --version
