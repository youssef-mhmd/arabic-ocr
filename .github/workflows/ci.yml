name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # Installs runtime + dev + data deps (no torch, no GUI), exactly as pinned in uv.lock.
      - run: uv sync --locked
      # Two fonts for the renderer tests (fonts are never committed to git).
      - run: uv run python -m training.download_fonts --only notonaskharabic,vazirmatn
      - run: uv run pytest
      - run: uv run arabic-ocr --version
