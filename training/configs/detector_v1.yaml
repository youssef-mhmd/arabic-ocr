# First text-line detector training run (M3).
#
#   uv run --group train python -m training.train_detector training/configs/detector_v1.yaml
#
# Outputs go to runs/<name>/ (git-ignored): log.csv, val.csv, last.pt, best.pt.
# Interrupt any time (Ctrl+C); run the same command again to resume.

name: detector_v1
seed: 2024
dataset: data/datasets/pages_v1
shard_size: 500

model: {}

# Training examples: random crop x crop windows of pages zoomed by scale_range.
crop: 640
scale_range: [0.45, 1.3]
crops_per_page: 2
batch_size: 16

# Passes over the 30,000 training pages (x crops_per_page crops each).
epochs: 12

optimizer:
  lr: 0.001
  weight_decay: 0.0001
  warmup_samples: 20000
  min_lr_fraction: 0.02
  grad_clip: 5.0

amp: bf16
num_workers: 8

# Validation: whole pages at the shipped working size (arabic_ocr.detect.detector).
max_side: 1536
val_pages: 200
log_every_steps: 100
val_every_samples: 60000
