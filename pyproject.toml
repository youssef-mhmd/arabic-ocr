[project]
name = "arabic-ocr"
version = "0.1.0"
description = "Offline, cross-platform OCR engine for Arabic-script text."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13"
# Runtime dependencies: what end users need to run OCR. Never add torch here.
dependencies = [
    "numpy>=2.5.4",
    # onnxruntime dropped macOS Intel (x86-64) wheels after 1.23.x, so Intel Macs
    # get the last version that supports them; every other platform gets the latest.
    "onnxruntime>=1.31.1 ; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "onnxruntime>=1.23.2,<1.24 ; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=13.0.0",
    "typer>=0.28.0",
    "pypdfium2>=5.15.2",
    # pikepdf 10.14+ needs macOS 15 on Apple Silicon; 10.13 keeps macOS 14 working.
    "pikepdf>=10.18.1 ; sys_platform != 'darwin'",
    "pikepdf>=10.13.0,<10.14 ; sys_platform == 'darwin'",
    "fonttools>=4.68.0",
    "fastapi>=0.163.0",
    "uvicorn>=0.54.0",
    "python-multipart>=0.0.33",
]

[project.optional-dependencies]
# The desktop app: `uv sync --extra gui`, or `pip install "arabic-ocr[gui]"`.
gui = ["pyside6-essentials>=6.12.0"]

[project.scripts]
arabic-ocr = "arabic_ocr.cli:app"

[project.gui-scripts]
arabic-ocr-gui = "arabic_ocr.gui.app:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
# Building the installers (PyInstaller). See packaging/README.md.
build = [
    "pyinstaller>=6.17.0",
]
# Synthetic data generation (text shaping, font rendering, config files). Small and
# available on every platform, so it is installed by default and tested in CI.
data = [
    "freetype-py>=2.5.1",
    "pyarrow>=26.0.1",
    "pyyaml>=6.0.3",
    "uharfbuzz>=0.57.0",
]
# Training only (a machine with an NVIDIA GPU: the owner's RTX 5060 laptop, or
# Kaggle/Colab/Linux). torch has no macOS Intel wheels for Python 3.13, so
# `uv sync --group train` does not work on Intel Macs.
train = [
    { include-group = "data" },
    "onnx>=1.23.2",
    "onnxscript>=0.7.2",
    "torch>=2.15.0",
]

[tool.uv]
# `uv sync` installs these groups unless told otherwise.
default-groups = ["dev", "data"]

# PyTorch from PyPI is CPU-only on Windows. Training needs the CUDA build, which
# PyTorch publishes on its own index. cu132 (CUDA 13.2) supports RTX 50-series
# (Blackwell) GPUs and needs an NVIDIA driver that supports CUDA 13.2 or newer.
# macOS keeps the normal PyPI build (it uses Apple's GPU through "MPS" instead).
[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true  # only used for the packages listed below

[tool.uv.sources]
torch = [{ index = "pytorch-cu132", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[tool.ruff]
line-length = 100
target-version = "py313"
# Notebooks are mostly shell commands (`!uv run ...`) for Kaggle/Colab.
extend-exclude = ["*.ipynb"]

[tool.ruff.format]
# Keep hand-aligned code examples in the learning notes readable.
exclude = ["docs/**"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "RUF"]
# RUF001-003 flag "ambiguous" Unicode characters. Arabic text is the whole point of
# this project, so these warnings would fire on every Arabic string.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets tests import the `training` package from the repo root.
pythonpath = ["."]
addopts = ["-ra", "--strict-markers"]
